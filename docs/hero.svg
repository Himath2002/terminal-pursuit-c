<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img">
  <title>Terminal Pursuit C game</title>
  <desc>A dark terminal-inspired banner with the Terminal Pursuit identity and an accurate illustrated game board.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A18"/>
      <stop offset=".58" stop-color="#0D2925"/>
      <stop offset="1" stop-color="#123C35"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EE787" stop-opacity=".20"/>
      <stop offset="1" stop-color="#56D4DD" stop-opacity=".02"/>
    </linearGradient>
    <filter id="terminal-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020C0B" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1440" height="680" rx="34" fill="url(#background)"/>
  <circle cx="1280" cy="78" r="300" fill="url(#glow)"/>
  <circle cx="96" cy="650" r="210" fill="#F5B942" opacity=".06"/>

  <g transform="translate(88 108)">
    <g transform="translate(0 0)">
      <rect width="74" height="74" rx="18" fill="#7EE787"/>
      <path d="M19 22h36v30H19Z" fill="#0D2925"/>
      <path d="m27 33 7 6-7 6M39 46h9" fill="none" stroke="#7EE787" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="0" y="132" fill="#56D4DD" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">C11 • POSIX TERMINAL</text>
    <text x="0" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="64" font-weight="800">Terminal Pursuit</text>
    <text x="0" y="255" fill="#D6E5E0" font-family="Arial, sans-serif" font-size="27">One target. One pursuer. Every move matters.</text>
    <text x="0" y="320" fill="#9DB9B1" font-family="Arial, sans-serif" font-size="20">A compact turn-based chase with immediate keyboard input,</text>
    <text x="0" y="352" fill="#9DB9B1" font-family="Arial, sans-serif" font-size="20">explicit game state, and deterministic movement boundaries.</text>

    <g transform="translate(0 408)">
      <rect width="128" height="45" rx="22.5" fill="#7EE787"/>
      <text x="64" y="29" text-anchor="middle" fill="#0D2925" font-family="Arial, sans-serif" font-size="14" font-weight="800">C11</text>
      <rect x="142" width="150" height="45" rx="22.5" fill="none" stroke="#56D4DD" stroke-width="1.5"/>
      <text x="217" y="29" text-anchor="middle" fill="#D7F5F3" font-family="Arial, sans-serif" font-size="14" font-weight="700">ZERO DEPS</text>
      <rect x="306" width="150" height="45" rx="22.5" fill="none" stroke="#F5B942" stroke-width="1.5"/>
      <text x="381" y="29" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">STRICT BUILD</text>
    </g>
  </g>

  <g transform="translate(790 62)" filter="url(#terminal-shadow)">
    <rect width="574" height="556" rx="24" fill="#030B0A"/>
    <rect width="574" height="54" rx="24" fill="#173C36"/>
    <rect y="30" width="574" height="24" fill="#173C36"/>
    <circle cx="28" cy="27" r="7" fill="#FF6B6B"/>
    <circle cx="52" cy="27" r="7" fill="#F5B942"/>
    <circle cx="76" cy="27" r="7" fill="#7EE787"/>
    <text x="287" y="32" text-anchor="middle" fill="#A8C4BC" font-family="Arial, sans-serif" font-size="12">terminal-pursuit — 8 × 24</text>

    <g transform="translate(34 86)" font-family="Courier New, monospace" font-size="15" xml:space="preserve">
      <text x="0" y="0" fill="#7EE787">$</text>
      <text x="18" y="0" fill="#C8D9D4">./build/terminal-pursuit 8 24</text>
      <text x="0" y="40" fill="#56D4DD" font-weight="700">TERMINAL PURSUIT</text>
      <text x="159" y="40" fill="#78958D">| W/A/S/D move | Q quit</text>

      <g fill="#8FB0A7">
        <text x="0" y="82">##########################</text>
        <text x="0" y="106">#<tspan fill="#7EE787" font-weight="700">P</tspan>                       #</text>
        <text x="0" y="130">#                        #</text>
        <text x="0" y="154">#           <tspan fill="#F5B942" font-weight="700">@</tspan>            #</text>
        <text x="0" y="178">#                        #</text>
        <text x="0" y="202">#                        #</text>
        <text x="0" y="226">#                        #</text>
        <text x="0" y="250">#                    <tspan fill="#FF7B72" font-weight="700">~</tspan>   #</text>
        <text x="0" y="274">#                        #</text>
        <text x="0" y="298">##########################</text>
      </g>

      <text x="0" y="342" fill="#7EE787">P</text>
      <text x="16" y="342" fill="#78958D">you</text>
      <text x="72" y="342" fill="#FF7B72">~</text>
      <text x="88" y="342" fill="#78958D">pursuer</text>
      <text x="176" y="342" fill="#F5B942">@</text>
      <text x="192" y="342" fill="#78958D">target</text>

      <rect x="0" y="378" width="506" height="54" rx="10" fill="#0D201D" stroke="#244B44"/>
      <text x="18" y="411" fill="#D6E5E0">Valid movement → pursuer turn → outcome check</text>
    </g>
  </g>
</svg>
