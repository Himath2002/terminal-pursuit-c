<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img">
  <title>Terminal Pursuit architecture</title>
  <desc>Four aligned modules show terminal input, player rules, pursuer rules, and rendering around one compact GameState.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#168A82"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#10312D" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1440" height="700" rx="32" fill="#F3F7F5"/>
  <text x="72" y="62" fill="#10312D" font-family="Arial, sans-serif" font-size="29" font-weight="800">A turn pipeline with one explicit state</text>
  <text x="72" y="94" fill="#59706A" font-family="Arial, sans-serif" font-size="16">Immediate input at the edge; deterministic rules in the core; ANSI output at the edge</text>

  <g fill="#7A8F89" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">
    <text x="72" y="138">INPUT EDGE</text>
    <text x="414" y="138">PLAYER TURN</text>
    <text x="756" y="138">PURSUIT RULES</text>
    <text x="1098" y="138">OUTPUT EDGE</text>
  </g>

  <g transform="translate(72 156)" filter="url(#shadow)">
    <rect width="270" height="300" rx="22" fill="#FFFFFF" stroke="#C9D7D2"/>
    <circle cx="38" cy="40" r="20" fill="#DDF6F2"/>
    <path d="M28 34h20v16H28Z" fill="#168A82"/>
    <text x="70" y="38" fill="#18342F" font-family="Arial, sans-serif" font-size="19" font-weight="800">Terminal I/O</text>
    <text x="70" y="59" fill="#59706A" font-family="Arial, sans-serif" font-size="11">terminal.c + main.c</text>
    <rect x="24" y="88" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="109" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Validate dimensions</text>
    <text x="40" y="127" fill="#72837E" font-family="Arial, sans-serif" font-size="10">5-60 rows • 5-160 columns</text>
    <rect x="24" y="153" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="174" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Read one key immediately</text>
    <text x="40" y="192" fill="#72837E" font-family="Arial, sans-serif" font-size="10">Restore termios before return</text>
    <rect x="24" y="222" width="222" height="42" rx="21" fill="#DDF6F2"/>
    <text x="135" y="248" text-anchor="middle" fill="#12645F" font-family="Arial, sans-serif" font-size="10" font-weight="800">W / A / S / D / Q</text>
  </g>

  <g transform="translate(414 156)" filter="url(#shadow)">
    <rect width="270" height="300" rx="22" fill="#FFFFFF" stroke="#C9D7D2"/>
    <circle cx="38" cy="40" r="20" fill="#E7F7D0"/>
    <text x="38" y="47" text-anchor="middle" fill="#335D1C" font-family="Arial, sans-serif" font-size="19" font-weight="800">P</text>
    <text x="70" y="38" fill="#18342F" font-family="Arial, sans-serif" font-size="19" font-weight="800">Player move</text>
    <text x="70" y="59" fill="#59706A" font-family="Arial, sans-serif" font-size="11">movement.c</text>
    <rect x="24" y="88" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="109" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Normalize key input</text>
    <text x="40" y="127" fill="#72837E" font-family="Arial, sans-serif" font-size="10">Uppercase and lowercase supported</text>
    <rect x="24" y="153" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="174" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Enforce board boundary</text>
    <text x="40" y="192" fill="#72837E" font-family="Arial, sans-serif" font-size="10">A valid direction consumes a turn</text>
    <rect x="24" y="222" width="222" height="42" rx="21" fill="#E7F7D0"/>
    <text x="135" y="248" text-anchor="middle" fill="#335D1C" font-family="Arial, sans-serif" font-size="10" font-weight="800">BOUNDED POSITION UPDATE</text>
  </g>

  <g transform="translate(756 156)" filter="url(#shadow)">
    <rect width="270" height="300" rx="22" fill="#FFFFFF" stroke="#C9D7D2"/>
    <circle cx="38" cy="40" r="20" fill="#FFE5E1"/>
    <text x="38" y="47" text-anchor="middle" fill="#B34336" font-family="Arial, sans-serif" font-size="20" font-weight="800">~</text>
    <text x="70" y="38" fill="#18342F" font-family="Arial, sans-serif" font-size="19" font-weight="800">Pursuer move</text>
    <text x="70" y="59" fill="#59706A" font-family="Arial, sans-serif" font-size="11">movement.c + game.c</text>
    <rect x="24" y="88" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="109" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Adjacent? Chase directly</text>
    <text x="40" y="127" fill="#72837E" font-family="Arial, sans-serif" font-size="10">Move one step on each required axis</text>
    <rect x="24" y="153" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="174" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Otherwise choose 1 of 8</text>
    <text x="40" y="192" fill="#72837E" font-family="Arial, sans-serif" font-size="10">Reject walls and the target cell</text>
    <rect x="24" y="222" width="222" height="42" rx="21" fill="#FFE5E1"/>
    <text x="135" y="248" text-anchor="middle" fill="#9D392E" font-family="Arial, sans-serif" font-size="10" font-weight="800">CAPTURE BEFORE VICTORY</text>
  </g>

  <g transform="translate(1098 156)" filter="url(#shadow)">
    <rect width="270" height="300" rx="22" fill="#FFFFFF" stroke="#C9D7D2"/>
    <circle cx="38" cy="40" r="20" fill="#E4ECFA"/>
    <path d="M26 31h24v19H26Z" fill="none" stroke="#46679F" stroke-width="2"/>
    <path d="m31 38 5 5-5 5M40 48h6" fill="none" stroke="#46679F" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="38" fill="#18342F" font-family="Arial, sans-serif" font-size="19" font-weight="800">Renderer</text>
    <text x="70" y="59" fill="#59706A" font-family="Arial, sans-serif" font-size="11">renderer.c</text>
    <rect x="24" y="88" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="109" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Derive every cell symbol</text>
    <text x="40" y="127" fill="#72837E" font-family="Arial, sans-serif" font-size="10">No duplicated board storage</text>
    <rect x="24" y="153" width="222" height="51" rx="12" fill="#F3F7F5"/>
    <text x="40" y="174" fill="#18342F" font-family="Arial, sans-serif" font-size="11" font-weight="700">Redraw with ANSI escapes</text>
    <text x="40" y="192" fill="#72837E" font-family="Arial, sans-serif" font-size="10">Legend and final status included</text>
    <rect x="24" y="222" width="222" height="42" rx="21" fill="#E4ECFA"/>
    <text x="135" y="248" text-anchor="middle" fill="#3E5B8D" font-family="Arial, sans-serif" font-size="10" font-weight="800">P  ~  @  #  X</text>
  </g>

  <g fill="none" stroke="#168A82" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M342 306H392"/>
    <path d="M684 306H734"/>
    <path d="M1026 306H1076"/>
  </g>

  <g transform="translate(414 506)" filter="url(#shadow)">
    <rect width="612" height="112" rx="22" fill="#10312D"/>
    <text x="28" y="34" fill="#7EE787" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3">SINGLE SOURCE OF TRUTH</text>
    <text x="28" y="67" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="800">GameState</text>
    <text x="151" y="67" fill="#BED1CB" font-family="Arial, sans-serif" font-size="13">dimensions • player • pursuer • target • status</text>
    <text x="28" y="92" fill="#8FAAA2" font-family="Arial, sans-serif" font-size="11">O(1) state • O(rows × columns) frame rendering • no heap allocation</text>
  </g>

  <g transform="translate(72 526)">
    <rect width="270" height="72" rx="18" fill="#FFF3D6" stroke="#E8C875"/>
    <text x="22" y="29" fill="#775413" font-family="Arial, sans-serif" font-size="12" font-weight="800">RANDOM SOURCE</text>
    <text x="22" y="50" fill="#8A6A2B" font-family="Arial, sans-serif" font-size="11">Target + distant pursuer direction</text>
  </g>

  <g transform="translate(1098 526)">
    <rect width="270" height="72" rx="18" fill="#DDF6F2" stroke="#9BD8D2"/>
    <text x="22" y="29" fill="#12645F" font-family="Arial, sans-serif" font-size="12" font-weight="800">LOCAL PROCESS ONLY</text>
    <text x="22" y="50" fill="#47716C" font-family="Arial, sans-serif" font-size="11">No files • no network • no shell calls</text>
  </g>

  <path d="M549 506V476" fill="none" stroke="#168A82" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M891 506V476" fill="none" stroke="#168A82" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
